version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qis_app_web        # fixed container name
    image: qis_app_web:latest
    env_file:
      - .env.docker
    ports:
      - "6001:6001"  # Reverb WebSocket port
    volumes:
      - app_code:/var/www/html                             # Share app code with nginx
      - storage:/var/www/html/storage                      # Persist storage (uploads, logs, etc)
      - ./.docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    working_dir: /var/www/html
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: qis_app_nginx
    ports:
      - "8080:80"
    volumes:
      - app_code:/var/www/html:ro                          # Read-only access to app code
      - storage:/var/www/html/storage                      # Same storage volume
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: qis_app_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qis_app
      MYSQL_USER: qis_user
      MYSQL_PASSWORD: PureF%%%2021
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network

volumes:
  dbdata:
  storage:
  app_code:

networks:
  app-network:
    driver: bridge
