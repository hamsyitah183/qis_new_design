version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qis_app_web        # fixed container name
    image: qis_app_web:latest
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
      - cache:/var/www/html/bootstrap/cache
    working_dir: /var/www/html
    # remove user here if PHP-FPM fails; permissions handled in Dockerfile
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: qis_app_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: qis_app_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qis_app
      MYSQL_USER: qis_user
      MYSQL_PASSWORD: PureF%%%2021
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network

volumes:
  dbdata:
  storage:
  cache:

networks:
  app-network:
    driver: bridge
